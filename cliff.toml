# git-cliff config: `make changelog` regenerates CHANGELOG.md from git history.
# Commits start with an imperative verb ("Add ...", "Fix ..."); the verb picks
# the Keep a Changelog section. https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
the policy in CONTRIBUTING.md.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^Merge", skip = true },
    { message = "^(Add|Introduce|Support|Initial)", group = "<!-- 0 -->Added" },
    { message = "^(Fix|Correct)", group = "<!-- 1 -->Fixed" },
    { message = "^(Remove|Delete|Drop)", group = "<!-- 2 -->Removed" },
    { message = "^Deprecate", group = "<!-- 3 -->Deprecated" },
    { message = "^(Security|Harden)", group = "<!-- 4 -->Security" },
    { message = ".*", group = "<!-- 5 -->Changed" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
