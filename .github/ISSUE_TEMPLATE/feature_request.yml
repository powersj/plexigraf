name: Feature request
description: Something Plexigraf should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Plexigraf to do. Check DESIGN.md first; it may already be planned or ruled out.
