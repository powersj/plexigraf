[workspace]
resolver = "3"
members = ["crates/tern"]
# Guest crates build for wasm32-wasip2, so they are not workspace members.
exclude = ["examples", "sdk/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust for the agent, set by wasmtime. CI checks it.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/powersj/tern"

[profile.release]
# Smaller, faster binary at the cost of a slower release build. Panics still
# unwind, so a panic in one pipeline task does not take down the agent.
lto = "thin"
codegen-units = 1
strip = true

# `cargo build --profile profiling` for samply or flamegraphs: release speed
# with symbols.
[profile.profiling]
inherits = "release"
strip = false
debug = true

# The profile that `dist` (cargo-dist) builds releases with.
[profile.dist]
inherits = "release"

# Lint levels shared by every workspace crate (opted in with `[lints] workspace = true`).
# The guest crates outside the workspace copy this table; keep them in sync.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more churn than they return here.
items_after_statements = "allow" # helper types next to the code that uses them are fine
too_many_lines = "allow"         # long orchestration functions are split by judgment, not by count

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
