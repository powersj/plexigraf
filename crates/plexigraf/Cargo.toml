[package]
name = "plexigraf"
description = "A pluggable, standards-based metrics agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The library and binary share a name; document only the library.
[[bin]]
name = "plexigraf"
doc = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "50", default-features = false, features = ["anyhow", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = "50"

[lints]
workspace = true

[dev-dependencies]
divan = "0.1"
insta = "1"
proptest = "1"

[[bench]]
name = "encoding"
harness = false
