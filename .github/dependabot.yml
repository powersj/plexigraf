version: 2
updates:
  # Every Rust crate with its own lockfile. Minor and patch bumps arrive as one
  # grouped PR per directory each week; major bumps get their own PRs.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/sdk/rust"
      - "/examples/random-rust"
      - "/crates/plexigraf/tests/plugins/*"
      - "/crates/plexigraf/fuzz"
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised version
    # is usually caught and yanked first.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA pins in .github/workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised version
    # is usually caught and yanked first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
