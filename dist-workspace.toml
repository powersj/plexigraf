[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# No Windows: the agent's shutdown handling uses Unix signals.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Supply chain: embed the dependency list in each binary (cargo auditable),
# publish a CycloneDX SBOM, and attest build provenance with GitHub.
cargo-auditable = true
cargo-cyclonedx = true
github-attestations = true
# Build only on release tags; PRs just check that the plan still works.
pr-run-mode = "plan"

# Pin the release workflow's actions by commit SHA, as in ci.yml. `dist
# generate` writes these into release.yml; Dependabot does not update them,
# so bump them here when you bump cargo-dist.
[dist.github-action-commits]
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
