[package]
name = "tern-sdk"
description = "SDK for writing Tern plugins in Rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
# Pick exactly one: the world the plugin targets.
scraper = []
processor = []
exporter = []

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
wit-bindgen = "0.63"

# Mirrors [workspace.lints] in the root Cargo.toml; keep the two in sync.
[lints.rust]
missing_docs = "warn"
# deny, not forbid: the wit-bindgen output in `bindings` needs `allow(unsafe_code)`.
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
items_after_statements = "allow"
too_many_lines = "allow"
# Public API: owned arguments keep signatures stable if the host ABI changes.
needless_pass_by_value = "allow"
# Every fallible SDK call returns `PluginError`, whose variants are documented once.
missing_errors_doc = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[package.metadata.docs.rs]
features = ["scraper"]
