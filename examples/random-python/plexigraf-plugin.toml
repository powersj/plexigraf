# Name and version come from here until `plexigraf plugin build` generates them
# from package metadata.
name = "random-py"
version = "0.1.0"
description = "Random integer and float gauges, for testing pipelines"
# The component embeds CPython, which needs more than the 64 MiB default.
memory_limit_mib = 256
sample_config = """
[receivers.random]
prefix = "random"
min = 0
max = 100
"""

[capabilities]
network.connect = []
filesystem.read = []
env = []
secrets = []
